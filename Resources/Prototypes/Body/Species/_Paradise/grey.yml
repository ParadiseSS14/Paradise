- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceGrey
  categories: [ HideSpawnMenu ]
  name: grey appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganGreyTorso
      Head: OrganGreyHead
      ArmLeft: OrganGreyArmLeft
      ArmRight: OrganGreyArmRight
      HandRight: OrganGreyHandRight
      HandLeft: OrganGreyHandLeft
      LegLeft: OrganGreyLegLeft
      LegRight: OrganGreyLegRight
      FootLeft: OrganGreyFootLeft
      FootRight: OrganGreyFootRight
      Brain: OrganGreyBrain
      Eyes: OrganGreyEyes
      Tongue: OrganGreyTongue
      Appendix: OrganGreyAppendix
      Ears: OrganGreyEars
      Lungs: OrganGreyLungs
      Heart: OrganGreyHeart
      Stomach: OrganGreyStomach
      Liver: OrganGreyLiver
      Kidneys: OrganGreyKidneys
  - type: HumanoidProfile
    species: Grey

- type: entity
  parent:
  - AppearanceGrey
  - BaseSpeciesMobOrganic
  - MobNightVision
  id: MobGrey
  name: Urist McBald
  components:
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: ExoticBlood
        Quantity: 600
  - type: Reactive
    groups:
      Acidic: [ Ingestion ] # Skip damage on touch
    reactions:
    - reagents: [ Water ] 
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        ignoreResistances: false
        damage:
          types:
            Caustic: 0.3 # Water is acidic to Greys
      - !type:Emote
        emote: Scream
        probability: 0.2
  - type: TelepathicChat # Send/Project Mind
    range: 14.0
  - type: UserInterface
    interfaces:
      enum.TelepathicChatUiKey.Send:
        type: TelepathicChatBoundUserInterface
      enum.TelepathicChatUiKey.Receive:
        type: TelepathicChatBoundUserInterface
      enum.TelepathicChatUiKey.Compose:
        type: TelepathicChatBoundUserInterface
        interactionRange: 0 # TelepathicChatSystem has own range checks, and this blocks obstruction
  - type: NightVision
    prioritized: false
    lightingColor: "#FFFFFF05" # Darkened from the base color
  - type: BlindedByFlashing
    eyeDamage: 3 # 3 flashes will blind a Grey (maxDamage is 9)
  - type: IntrinsicRadioReceiver 
  - type: IntrinsicRadioTransmitter
    channels:
    - Greymind # Grey hivemind
  - type: ActiveRadio
    channels: 
    - Greymind

