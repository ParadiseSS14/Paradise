- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceGrey
  categories: [ HideSpawnMenu ]
  name: grey appearance
  components:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/_Paradise/Grey/displacement.rsi
            state: jumpsuit-female
  - type: InitialBody
    organs:
      Torso: OrganGreyTorso
      Head: OrganGreyHead
      ArmLeft: OrganGreyArmLeft
      ArmRight: OrganGreyArmRight
      HandRight: OrganGreyHandRight
      HandLeft: OrganGreyHandLeft
      LegLeft: OrganGreyLegLeft
      LegRight: OrganGreyLegRight
      FootLeft: OrganGreyFootLeft
      FootRight: OrganGreyFootRight
      Brain: OrganGreyBrain
      Eyes: OrganGreyEyes
      Tongue: OrganGreyTongue
      Appendix: OrganGreyAppendix
      Ears: OrganGreyEars
      Lungs: OrganGreyLungs
      Heart: OrganGreyHeart
      Stomach: OrganGreyStomach
      Liver: OrganGreyLiver
      Kidneys: OrganGreyKidneys
  - type: HumanoidProfile
    species: Grey

- type: entity
  parent:
  - AppearanceGrey
  - BaseSpeciesMobOrganic
  - MobNightVision
  id: MobGrey
  name: Urist McBald
  components:
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
  - type: NightVision
    prioritized: false
    lightingColor: "#FFFFFF10"
  ## SS14 has no organ damage
  ## So apply small burn to the mob instead
  - type: DamagedByFlashing
    flashDamage:
      types:
        Heat: 5

