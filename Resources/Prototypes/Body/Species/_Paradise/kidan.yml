    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 0
      required: true
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: true
    enum.HumanoidVisualLayers.LArm:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 0
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceKidan
  categories: [ HideSpawnMenu ]
  name: kidan appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganKidanTorso
      Head: OrganKidanHead
      ArmLeft: OrganKidanArmLeft
      ArmRight: OrganKidanArmRight
      HandRight: OrganKidanHandRight
      HandLeft: OrganKidanHandLeft
      LegLeft: OrganKidanLegLeft
      LegRight: OrganKidanLegRight
      FootLeft: OrganKidanFootLeft
      FootRight: OrganKidanFootRight
      Brain: OrganKidanBrain
      Eyes: OrganKidanEyes
##      Tongue: OrganKidanTongue
##      Appendix: OrganKidanAppendix
##      Ears: OrganKidanEars
      Lungs: OrganKidanLungs
      Heart: OrganKidanHeart
##      Stomach: OrganKidanStomach
      Liver: OrganKidanLiver
      Kidneys: OrganKidanKidneys
  - type: HumanoidProfile
    species: Kidan

- type: entity
  parent:
  - AppearanceKidan
  - BaseSpeciesMobOrganic
  id: MobKidan
  name: Mandibles Joe
  components:
  - type: UnpoweredFlashlight
    toggleAction: ActionBioLight
  - type: PointLight
    enabled: false
    radius: 3 # a little over double a PDA's flashlight radius, as a treat
  - type: Hunger
    baseDecayRate: 1.2
  - type: Thirst
    baseDecayRate: 1.2
  - type: Damageable
    damageModifierSet: Kidan
  - type: MeleeWeapon
    animation: WeaponArcClaw
    soundHit:
      collection: AlienClaw
    damage:
      types:
        Slash: 5
        Piercing: 2
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - SpiderCraft
    - AnomalyHost
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 5
  - type: Reactive
    reactions:
    - reagents:
      - PestKiller
      methods:
      - Touch
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 0.2
      - !type:PopupMessage
        type: Local
        visualType: Large
        messages:
        - "kidan-hurt-by-pest-spray-popup"
        probability: 0.66
    - reagents:
      - Water
      - SpaceCleaner
      methods:
      - Touch
      effects:
      - !type:WashCreamPie
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 600
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#162581"
      Burn:
        sprite: Mobs/Effects/burn_damage.rsi
  - type: Speech
    speechVerb: Arachnid
    speechSounds: Arachnid
    allowedEmotes:
    - 'Click'
    - 'Chitter'
  - type: Vocal
    emoteSounds: UnisexArachnid
  - type: TypingIndicator
    proto: human
  - type: CreamPied
    sprite:
      sprite: Effects/creampie.rsi
      state: creampie_arachnid

