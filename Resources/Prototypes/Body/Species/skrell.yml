- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceSkrell
  categories: [HideSpawnMenu]
  name: Skrell appearance
  components:
    - type: Inventory
      femaleDisplacements:
        jumpsuit:
          sizeMaps:
            32:
              sprite: Mobs/Species/Skrell/displacement.rsi
              state: jumpsuit-female
    - type: InitialBody
      organs:
        Torso: OrganSkrellTorso
        Head: OrganSkrellHead
        ArmLeft: OrganSkrellArmLeft
        ArmRight: OrganSkrellArmRight
        HandRight: OrganSkrellHandRight
        HandLeft: OrganSkrellHandLeft
        LegLeft: OrganSkrellLegLeft
        LegRight: OrganSkrellLegRight
        FootLeft: OrganSkrellFootLeft
        FootRight: OrganSkrellFootRight
        Brain: OrganSkrellCore
        Eyes: OrganSkrellEyes
        Lungs: OrganSkrellLungs
    - type: HumanoidProfile
      species: Skrell

- type: entity
  parent:
    - AppearanceSkrell
    - BaseSpeciesMobOrganic
  id: MobSkrell
  name: Urist McWarbles
  components:
    - type: Storage
      clickInsert: false
      grid:
        - 0,0,1,2
      maxItemSize: Medium
    - type: ContainerContainer
      containers:
        storagebase: !type:Container
          ents: []
    - type: UserInterface
      interfaces:
        enum.StorageUiKey.Key:
          type: StorageBoundUserInterface
        enum.HumanoidMarkingModifierKey.Key:
          type: HumanoidMarkingModifierBoundUserInterface
        enum.StrippingUiKey.Key:
          type: StrippableBoundUserInterface
    - type: UseDelay
      delay: 0.5
    - type: Speech
      speechVerb: Skrell
      speechSounds: Skrell
      allowedEmotes: ["Warble"]
    - type: DamageVisuals
      damageOverlayGroups:
        Brute:
          sprite: Mobs/Effects/brute_damage.rsi
          color: "#2cf274"
        Burn:
          sprite: Mobs/Effects/burn_damage.rsi
    - type: Bloodstream
      bloodReferenceSolution:
        reagents:
          - ReagentId: CopperBlood
            Quantity: 600

