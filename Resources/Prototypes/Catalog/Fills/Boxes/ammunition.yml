# As opposed to MagazineBox these are boxes of magazines so BoxMagazine
# CaselessRifle
- type: entity
  name: box of magazines
  parent: BoxCardboard
  id: BoxMagazine
  description: A box full of magazines.
  components:
    - type: Sprite
      layers:
        - state: box_security
        - state: magazine

- type: entity
  name: box of 8x18 caseless magazines #PARADISE EDIT - Weapon overhaul
  parent: BoxMagazine
  id: BoxMagazinePistolCaselessRifle
  description: A box full of 8x18 caseless magazines. #PARADISE EDIT - Weapon overhaul
  components:
    - type: EntityTableContainerFill
      containers:
        storagebase:
          id: MagazinePistolCaselessRifle
          amount: 4

- type: entity
  name: box of 8x18 caseless (practice) magazines #PARADISE EDIT - Weapon overhaul
  parent: BoxMagazine
  id: BoxMagazinePistolCaselessRiflePractice
  description: A box full of 8x18 caseless practice magazines. #PARADISE EDIT - Weapon overhaul
  components:
    - type: EntityTableContainerFill
      containers:
        storagebase:
          id: MagazinePistolCaselessRiflePractice
          amount: 4

