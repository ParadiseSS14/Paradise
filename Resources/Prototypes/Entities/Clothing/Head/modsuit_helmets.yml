- type: entity
  id: StandardModHelmet
  parent: [ClothingHeadBase]
  name: standard MOD helmet
  components:
    - type: Sprite
      sprite: Clothing/Back/Modsuits/standard.rsi
      layers:
        - state: icon-helmet
          map: ["enum.ToggleableVisuals.Enabled"]

    - type: Clothing
      sprite: Clothing/Back/Modsuits/standard.rsi
      slots:
        - head
      clothingVisuals:
        head:
          - state: equipped-helmet

    - type: PressureProtection
      highPressureMultiplier: 1
      lowPressureMultiplier: 1

    - type: TemperatureProtection
      coefficient: 0.8

    - type: ModsuitClothing
      lowPressureModifier: 0
      lowPressureMultiplier: 1000
      highPressureModifier: 0
      highPressureMultiplier: 0.1
      coefficientModifier: 0.8

    - type: ToggleableVisuals
      spriteLayer: enum.ToggleableVisuals.Layer
      clothingVisuals:
        head:
          - state: equipped-helmet-sealed

    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.ToggleableVisuals.Enabled:
          enum.ModsuitVisuals.IconLayer:
            True: { state: "icon-helmet-sealed" }
            False: { state: "icon-helmet" }
