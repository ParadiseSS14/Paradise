- type: entity
  id: StandardModBoots
  parent: ClothingShoesBase
  name: standard MOD boots
  components:

  - type: Sprite
    sprite: Clothing/Back/Modsuits/standard.rsi
    layers:
      - state: icon-boots
        map: ["enum.ToggleableVisuals.Enabled"]

  - type: Clothing
    sprite: Clothing/Back/Modsuits/standard.rsi
    slots:
    - FEET
    clothingVisuals:
      shoes:
      - state: equipped-boots

  - type: ModsuitClothing

  - type: ToggleableVisuals
    spriteLayer: enum.ToggleableVisuals.Layer
    clothingVisuals:
      shoes:
      - state: equipped-boots-sealed

  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ModsuitVisuals.IconLayer:
            True: {state: "icon-boots-sealed"}
            False: {state: "icon-boots"}
