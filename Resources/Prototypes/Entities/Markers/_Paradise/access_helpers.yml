- type: entity
  abstract: true
  name: Access Helper
  id: AccessHelper
  description: "Base Access Helper"
  parent: MarkerBase
  components:
    - type: Sprite
      sprite: Markers/_Paradise/access_helper.rsi
      layers:
        - state: access_helper
          shader: unshaded
    - type: AccessHelper
    - type: LocalGatherTargets

