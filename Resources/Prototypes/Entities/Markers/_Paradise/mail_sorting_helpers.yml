- type: entity
  abstract: true
  name: Disposal Junction Helper
  id: MailSortingHelper
  parent: MarkerBase
  components:
      - type: Sprite
        sprite: Markers/_Paradise/mail_sorting_helper.rsi
        state: mail_sorting
        shader: unshaded
      - type: MailSortingHelper

# Cargo
- type: entity
  name: Cargo Disposal Junction Helper
  suffix: "Mailroom"
  id: CargoMailroomMailSortingHelper
  parent: MailSortingHelper
  components:
