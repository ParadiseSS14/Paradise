- type: entity
  id: BannerBase
  parent: BaseItem
  name: base banner
  description: It's the concept of a banner, you shouldn't be seeing this.
  abstract: true
  components:
  - type: Sprite
    layers:
    - state: icon
      map: ["base"]
    - state: burningbanner
      sprite: Objects/Decoration/_Paradise/Banners/burningbanner.rsi
      visible: false
      map: ["burning"]
  - type: GenericVisualizer
    visuals:
      enum.BannerVisuals.State:
        base:
          Unrolled: { state: icon }
          Rolled: { state: icon-rolled }
        burning:
          Unrolled: { state: burningbanner }
          Rolled: { state: burningbanner-rolled }
      enum.BannerVisuals.Burning:
        burning:
          True: { visible: true }
          False: { visible: false }
  - type: Appearance
  - type: InteractionOutline
  - type: Item
    size: Huge
  - type: UseDelay
    delay: 1
