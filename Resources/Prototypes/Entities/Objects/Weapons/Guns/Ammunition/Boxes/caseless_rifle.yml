- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMagazineBoxCaselessRifle
  name: ammunition box (8x18 caseless) #PARADISE EDIT - Weapon overhaul
  components:
    - type: BallisticAmmoProvider
      mayTransfer: true
      whitelist:
        tags:
          - CartridgeCaselessRifle
      proto: CartridgeCaselessRifle
      capacity: 60
    - type: Item
      size: Small
    - type: ContainerContainer
      containers:
        ballistic-ammo: !type:Container
    - type: Sprite
      sprite: Objects/Weapons/Guns/Ammunition/Boxes/caseless_rifle.rsi
    - type: MagazineVisuals
      magState: mag
      steps: 4
      zeroVisible: false
    - type: Appearance

# Boxes
- type: entity
  parent: BaseMagazineBoxCaselessRifle
  id: MagazineBoxCaselessRifle
  name: ammunition box (8x18 caseless) #PARADISE EDIT - Weapon overhaul
  description: A cardboard box of 8x18 caseless rounds. Intended to hold general-purpose kinetic ammunition. #PARADISE EDIT - Weapon overhaul
  components:
    - type: BallisticAmmoProvider
      proto: CartridgeCaselessRifle
    - type: Sprite
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-1
          map: ["enum.GunVisualLayers.Mag"]

- type: entity
  parent: BaseMagazineBoxCaselessRifle
  id: MagazineBoxCaselessRiflePractice
  name: ammunition box (8x18 caseless practice) #PARADISE EDIT - Weapon overhaul
  description: A cardboard box of 8x18 caseless rounds. Intended to hold harmless practice ammunition. #PARADISE EDIT - Weapon overhaul
  components:
    - type: BallisticAmmoProvider
      proto: CartridgeCaselessRiflePractice
    - type: Sprite
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-1
          map: ["enum.GunVisualLayers.Mag"]
        - state: practice
