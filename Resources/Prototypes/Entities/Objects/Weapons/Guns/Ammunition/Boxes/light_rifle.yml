- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMagazineBoxLightRifle
  name: ammunition box (7,62x41 rifle) #PARADISE EDIT - Weapon overhaul
  components:
    - type: BallisticAmmoProvider
      mayTransfer: true
      whitelist:
        tags:
          - CartridgeLightRifle
      proto: CartridgeLightRifle
      capacity: 60
    - type: Item
      size: Small
    - type: ContainerContainer
      containers:
        ballistic-ammo: !type:Container
    - type: Sprite
      sprite: Objects/Weapons/Guns/Ammunition/Boxes/light_rifle.rsi
    - type: MagazineVisuals
      magState: mag
      steps: 4
      zeroVisible: false
    - type: Appearance

# Boxes
- type: entity
  parent: BaseMagazineBoxLightRifle
  id: MagazineBoxLightRifleBig
  name: ammunition box (7,62x41 rifle) #PARADISE EDIT - Weapon overhaul
  suffix: Big
  components:
    - type: BallisticAmmoProvider
      capacity: 200
      proto: CartridgeLightRifle
    - type: Sprite
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-1
          map: ["enum.GunVisualLayers.Mag"]

