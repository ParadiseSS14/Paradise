- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMagazineBoxMagnum
  components:
    - type: BallisticAmmoProvider
      mayTransfer: true
      whitelist:
        tags:
          - CartridgeMagnum
      proto: CartridgeMagnum
      capacity: 12
    - type: Item
      size: Small
    - type: ContainerContainer
      containers:
        ballistic-ammo: !type:Container
    - type: Sprite
      sprite: Objects/Weapons/Guns/Ammunition/Boxes/magnum.rsi
    - type: MagazineVisuals
      magState: mag
      steps: 4
      zeroVisible: false
    - type: Appearance

# Boxes
- type: entity
  parent: BaseMagazineBoxMagnum
  id: MagazineBoxMagnum
  name: ammunition box (11,5x32 magnum) #PARADISE EDIT - Weapon overhaul
  description: A cardboard box of 11,5x32 magnum rounds. Intended to hold general-purpose kinetic ammunition. #PARADISE EDIT - Weapon overhaul
  components:
    - type: BallisticAmmoProvider
      proto: CartridgeMagnum
    - type: Sprite
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-1
          map: ["enum.GunVisualLayers.Mag"]

