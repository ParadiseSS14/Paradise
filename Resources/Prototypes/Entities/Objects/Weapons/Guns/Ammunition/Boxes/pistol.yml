- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMagazineBoxPistol
  name: ammunition box (9x20 auto) #PARADISE EDIT - Weapon overhaul
  components:
    - type: BallisticAmmoProvider
      mayTransfer: true
      whitelist:
        tags:
          - CartridgePistol
      proto: CartridgePistol
      capacity: 60
    - type: Item
      size: Small
    - type: ContainerContainer
      containers:
        ballistic-ammo: !type:Container
    - type: Sprite
      sprite: Objects/Weapons/Guns/Ammunition/Boxes/pistol.rsi
    - type: MagazineVisuals
      magState: mag
      steps: 3
      zeroVisible: false
    - type: Appearance

# Boxes
- type: entity
  parent: BaseMagazineBoxPistol
  id: MagazineBoxPistol
  name: ammunition box (9x20 auto) #PARADISE EDIT - Weapon overhaul
  description: A cardboard box of 9x20 auto rounds. Intended to hold general-purpose kinetic ammunition. #PARADISE EDIT - Weapon overhaul
  components:
    - type: BallisticAmmoProvider
      proto: CartridgePistol
    - type: Sprite
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-1
          map: ["enum.GunVisualLayers.Mag"]

