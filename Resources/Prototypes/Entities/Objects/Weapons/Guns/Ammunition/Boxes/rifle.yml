- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMagazineBoxRifle
  components:
    - type: BallisticAmmoProvider
      mayTransfer: true
      whitelist:
        tags:
          - CartridgeRifle
      proto: CartridgeRifle
      capacity: 60 #PARADISE EDIT - Weapon overhaul
    - type: Item
      size: Small
    - type: ContainerContainer
      containers:
        ballistic-ammo: !type:Container
    - type: Sprite
      sprite: Objects/Weapons/Guns/Ammunition/Boxes/rifle.rsi
    - type: MagazineVisuals
      magState: mag
      steps: 4
      zeroVisible: false
    - type: Appearance

# Boxes
- type: entity
  parent: BaseMagazineBoxRifle
  id: MagazineBoxRifleBig
  name: ammunition box (6,3x47 rifle) #PARADISE EDIT - Weapon overhaul
  suffix: Big
  components:
    - type: BallisticAmmoProvider
      capacity: 200
      proto: CartridgeRifle
    - type: Sprite
      layers:
        - state: base-big
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-big-1
          map: ["enum.GunVisualLayers.Mag"]
    - type: MagazineVisuals
      magState: mag-big
      steps: 4
      zeroVisible: false
    - type: Appearance

- type: entity
  parent: BaseMagazineBoxRifle
  id: MagazineBoxRifle
  name: ammunition box (6,3x47 rifle) #PARADISE EDIT - Weapon overhaul
  description: A cardboard box of 6,3x47 rifle rounds. Intended to hold general-purpose kinetic ammunition. #PARADISE EDIT - Weapon overhaul
  components:
    - type: BallisticAmmoProvider
      proto: CartridgeRifle
    - type: Sprite
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-1
          map: ["enum.GunVisualLayers.Mag"]

