- type: entity
  abstract: true
  parent: [BaseMagazinePistol, BaseSecurityContraband]
  id: BaseMagazineMagnum
  name: pistol magazine (11,5x32 magnum) #PARADISE EDIT - Weapon overhaul
  components:
    - type: Tag
      tags:
        - MagazineMagnum
    - type: BallisticAmmoProvider
      mayTransfer: true
      whitelist:
        tags:
          - CartridgeMagnum
      capacity: 7

- type: entity
  parent: BaseMagazineMagnum
  id: MagazineMagnumEmpty
  name: pistol magazine (11,5x32 magnum any) #PARADISE EDIT - Weapon overhaul
  suffix: empty
  description: 7-round single stack magazine for large-caliber pistols.
  components:
    - type: BallisticAmmoProvider
      proto: null
    - type: Sprite
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-1
          map: ["enum.GunVisualLayers.Mag"]
    - type: Item
      inhandVisuals:
        left:
          - state: inhand-left-mag
        right:
          - state: inhand-right-mag

- type: entity
  parent: BaseMagazineMagnum
  id: MagazineMagnum
  name: pistol magazine (11,5x32 magnum) #PARADISE EDIT - Weapon overhaul
  description: 7-round single stack magazine for large-caliber pistols. Intended to hold general-purpose kinetic ammunition.
  components:
    - type: BallisticAmmoProvider
      proto: CartridgeMagnum
    - type: Sprite
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-1
          map: ["enum.GunVisualLayers.Mag"]
    - type: Item
      inhandVisuals:
        left:
          - state: inhand-left-mag
        right:
          - state: inhand-right-mag

- type: entity
  parent: BaseMagazineMagnum
  id: MagazineMagnumPractice
  name: pistol magazine (11,5x32 magnum practice) #PARADISE EDIT - Weapon overhaul
  description: 7-round single stack magazine for large-caliber pistols. Intended to hold harmless practice ammunition.
  components:
    - type: BallisticAmmoProvider
      proto: CartridgeMagnumPractice
    - type: Sprite
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-1
          map: ["enum.GunVisualLayers.Mag"]
        - state: stripe
          color: "#dbdbdb"
    - type: Item
      inhandVisuals:
        left:
          - state: inhand-left-mag
          - state: inhand-left-stripe
            color: "#dbdbdb"
        right:
          - state: inhand-right-mag
          - state: inhand-right-stripe
            color: "#dbdbdb"

