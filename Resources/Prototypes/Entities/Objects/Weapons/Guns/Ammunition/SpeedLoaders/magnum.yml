- type: entity
  abstract: true
  parent: [BaseItem, BaseSecurityContraband]
  id: BaseSpeedLoaderMagnum
  name: "speed loader (11,5x32 magnum)" #PARADISE EDIT - Weapon overhaul
  components:
    - type: Tag
      tags:
        - SpeedLoaderMagnum
    - type: SpeedLoader
    - type: BallisticAmmoProvider
      whitelist:
        tags:
          - CartridgeMagnum
      capacity: 6
    - type: Sprite
    - type: ContainerContainer
      containers:
        ballistic-ammo: !type:Container
          ents: []

- type: entity
  parent: BaseSpeedLoaderMagnum
  id: SpeedLoaderMagnum
  name: "speed loader (11,5x32 magnum)" #PARADISE EDIT - Weapon overhaul
  description: Designed to quickly load up to six rounds of 11,5x32 magnum into an empty revolver. Intended to hold general-purpose kinetic ammunition. #PARADISE EDIT - Weapon overhaul
  components:
    - type: BallisticAmmoProvider
      proto: CartridgeMagnum
    - type: Sprite
      sprite: Objects/Weapons/Guns/Ammunition/SpeedLoaders/Magnum/magnum_speed_loader.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: base-6
          map: ["enum.GunVisualLayers.Mag"]
    - type: MagazineVisuals
      magState: base
      steps: 7
      zeroVisible: false
    - type: Appearance
    - type: Item
      inhandVisuals:
        left:
          - state: inhand-left-mag
          - state: inhand-left-ammo
        right:
          - state: inhand-right-mag
          - state: inhand-right-ammo

- type: entity
  parent: SpeedLoaderMagnum
  id: SpeedLoaderMagnumEmpty
  name: "speed loader (11,5x32 magnum any)" #PARADISE EDIT - Weapon overhaul
  suffix: empty
  description: Designed to quickly load up to six rounds of 11,5x32 magnum into an empty revolver. #PARADISE EDIT - Weapon overhaul
  components:
    - type: BallisticAmmoProvider
      proto: null
    - type: Sprite
      sprite: Objects/Weapons/Guns/Ammunition/SpeedLoaders/Magnum/magnum_speed_loader.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        # TODO: This is actually a issue with all the speed loaders:
        #       You can mix different ammo types, but it will always
        #       use the one it was printed for.
        - state: base-6
          map: ["enum.GunVisualLayers.Mag"]
    - type: Item
      inhandVisuals:
        left:
          - state: inhand-left-mag
        right:
          - state: inhand-right-mag

- type: entity
  parent: SpeedLoaderMagnum
  id: SpeedLoaderMagnumIncendiary
  name: "speed loader (11,5x32 magnum incendiary)" #PARADISE EDIT - Weapon overhaul
  description: Designed to quickly load up to six rounds of 11,5x32 magnum into an empty revolver. Intended to hold self-igniting incendiary ammunition. #PARADISE EDIT - Weapon overhaul
  components:
    - type: BallisticAmmoProvider
      proto: CartridgeMagnumIncendiary

- type: entity
  parent: BaseSpeedLoaderMagnum
  id: SpeedLoaderMagnumPractice
  name: "speed loader (11,5x32 magnum practice)" #PARADISE EDIT - Weapon overhaul
  description: Designed to quickly load up to six rounds of 11,5x32 magnum into an empty revolver. Intended to hold harmless practice ammunition. #PARADISE EDIT - Weapon overhaul
  components:
    - type: BallisticAmmoProvider
      proto: CartridgeMagnumPractice
    - type: Sprite
      sprite: Objects/Weapons/Guns/Ammunition/SpeedLoaders/Magnum/magnum_speed_loader.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: practice-6
          map: ["enum.GunVisualLayers.Mag"]
    - type: MagazineVisuals
      magState: practice
      steps: 7
      zeroVisible: false
    - type: Appearance
    - type: Item
      inhandVisuals:
        left:
          - state: inhand-left-mag
          - state: inhand-left-ammo
          - state: inhand-left-stripe
            color: "#ea5800"
        right:
          - state: inhand-right-mag
          - state: inhand-right-ammo
          - state: inhand-right-stripe
            color: "#ea5800"

