- type: entity
  parent: [BaseItem, BaseSecurityContraband]
  id: SpeedLoaderLightRifle
  name: "speed loader (7,62x55 rifle)" #PARADISE EDIT - Weapon overhaul
  description: 5-round 'stripper clip' for quickly reloading the Kardashev-Mosin. Intended to hold general-purpose kinetic ammunition.
  components:
    - type: SpeedLoader
    - type: BallisticAmmoProvider
      mayTransfer: true
      whitelist:
        tags:
          - FullRifleCartridge #PARADISE EDIT - Weapon overhaul
      capacity: 5
      proto: FullRifleCartridge #PARADISE EDIT - Weapon overhaul
    - type: Sprite
      sprite: Objects/Weapons/Guns/Ammunition/SpeedLoaders/LightRifle/light_rifle_speed_loader.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-5
          map: ["enum.GunVisualLayers.Mag"]
    - type: MagazineVisuals
      magState: mag
      steps: 6
      zeroVisible: false
    - type: Appearance
    - type: ContainerContainer
      containers:
        ballistic-ammo: !type:Container
          ents: []
