- type: entity
  name: BaseWeaponRifle
  parent: [BaseItem, BaseGunWieldable]
  id: BaseWeaponRifle
  description: A rooty tooty point and shooty.
  abstract: true
  components:
    - type: Sprite
    - type: Item
      size: Huge
      shape:
        - 0,0,3,2
    - type: Clothing
      sprite: Objects/Weapons/Guns/Rifles/ak.rsi
      quickEquip: false
      slots:
        - Back
        - suitStorage
    - type: AmmoCounter
    - type: Gun
      fireRate: 5
      selectedMode: FullAuto
      availableModes:
        - FullAuto
        - SemiAuto
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/batrifle.ogg
    - type: ChamberMagazineAmmoProvider
      soundRack:
        path: /Audio/Weapons/Guns/Cock/sf_rifle_cock.ogg
    - type: ItemSlots
      slots:
        gun_magazine:
          name: Magazine
          startingItem: MagazineLightRifle
          insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
          ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
          priority: 2
          whitelist:
            tags:
              - MagazineLightRifle
          whitelistFailPopup: gun-magazine-whitelist-fail
        gun_chamber:
          name: Chamber
          priority: 1
          whitelist:
            tags:
              - CartridgeLightRifle
    - type: ContainerContainer
      containers:
        gun_magazine: !type:ContainerSlot
        gun_chamber: !type:ContainerSlot
    - type: StaticPrice
      price: 500

- type: entity
  name: AK-41 #PARADISE EDIT - WeaponOverhaul
  parent: [BaseWeaponRifle, BaseSecurityContraband]
  id: WeaponRifleAk
  description: A somewhat battered combat rifle of a design originating from old Earth. Favored by criminals, militias, and terrorists due to its famed reliability and easy-to-manufacture design. Feeds from .30 rifle magazines.
  components:
    - type: Sprite
      sprite: Objects/Weapons/Guns/Rifles/ak.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-0
          map: ["enum.GunVisualLayers.Mag"]
    #PARADISE EDIT START - Add aiming
    - type: Gun
      minAngle: 15
      maxAngle: 36
      angleIncrease: 2.50
      angleDecay: 6.1
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/rifle2.ogg
    - type: GunWieldBonus
      minAngle: -4
      maxAngle: -18
      angleIncrease: -0.9
    - type: GunAimable
      minAngle: -10
      maxAngle: -9
    #PARADISE EDIT END
    - type: ChamberMagazineAmmoProvider
      soundRack:
        path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
    - type: ItemSlots
      slots:
        gun_magazine:
          name: Magazine
          startingItem: MagazineLightRifle
          insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
          ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
          priority: 2
          whitelist:
            tags:
              - MagazineLightRifle
          whitelistFailPopup: gun-magazine-whitelist-fail
        gun_chamber:
          name: Chamber
          priority: 1
          whitelist:
            tags:
              - CartridgeLightRifle
    - type: ContainerContainer
      containers:
        gun_magazine: !type:ContainerSlot
        gun_chamber: !type:ContainerSlot
    - type: MagazineVisuals
      magState: mag
      steps: 1
      zeroVisible: true
    - type: Appearance

