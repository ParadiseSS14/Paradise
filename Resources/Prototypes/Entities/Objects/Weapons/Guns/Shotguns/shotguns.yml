- type: entity
  name: BaseWeaponShotgun
  parent: BaseItem
  id: BaseWeaponShotgun
  description: A rooty tooty point and shooty.
  abstract: true
  components:
    - type: Sprite
      layers:
        - state: icon
          map: ["enum.GunVisualLayers.Base"]
    - type: Item
      size: Large
      shape:
        - 0,0,4,0
    - type: Clothing
      sprite: Objects/Weapons/Guns/Shotguns/db_shotgun.rsi
      quickEquip: false
      slots:
        - Back
        - suitStorage
    - type: AmmoCounter
    - type: Gun
      fireRate: 2
      selectedMode: SemiAuto
      angleIncrease: 7 #PARADISE EDIT START - Weapon overhaul
      availableModes:
        - SemiAuto
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/shotgun.ogg
      soundEmpty:
        path: /Audio/Weapons/Guns/Empty/empty.ogg
    - type: CustomSpriteAmmoCounter
      loadedAmmoSprite: Interface/ItemStatus/Shotgun_Shells/not_spent.png
      spentAmmoSprite: Interface/ItemStatus/Shotgun_Shells/spent.png
    - type: BallisticAmmoProvider
      whitelist:
        tags:
          - ShellShotgun
      capacity: 7
      proto: ShellShotgun
      soundInsert:
        path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg
    - type: ContainerContainer
      containers:
        ballistic-ammo: !type:Container
          ents: []
    - type: StaticPrice
      price: 500

#PARADISE EDIT START - ChamberMagazineExtension
- type: entity
  name: BaseWeaponShotgun
  parent: BaseItem
  id: BaseWeaponShotgunAlt
  description: A rooty tooty point and shooty.
  abstract: true
  components:
    - type: CustomSpriteAmmoCounter
      loadedAmmoSprite: Interface/ItemStatus/Shotgun_Shells/not_spent.png
      spentAmmoSprite: Interface/ItemStatus/Shotgun_Shells/spent.png
    - type: Sprite
      layers:
        - state: icon
          map: ["enum.GunVisualLayers.Base"]
    - type: Item
      size: Large
      shape:
        - 0,0,4,0
    - type: Clothing
      sprite: Objects/Weapons/Guns/Shotguns/db_shotgun.rsi
      quickEquip: false
      slots:
        - Back
        - suitStorage
    - type: AmmoCounter
    - type: Gun
      fireRate: 2
      angleIncrease: 7
      selectedMode: SemiAuto
      availableModes:
        - SemiAuto
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/shotgun.ogg
      soundEmpty:
        path: /Audio/Weapons/Guns/Empty/empty.ogg
    - type: ChamberMagazineAmmoProvider
      canBeLoadedManually: true
      mustBeLoadedThroughChamber: false
      soundRack:
        path: /Audio/Weapons/Guns/Cock/m41_cock.ogg
    - type: InternalMagazine
    - type: ItemSlots
      slots:
        gun_magazine:
          name: Magazine
          startingItem: InternalMagazineShotgun
          insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
          ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
          priority: 2
          whitelistFailPopup: gun-magazine-whitelist-fail
        gun_chamber:
          name: Chamber
          priority: 1
          whitelist:
            tags:
              - ShellShotgun
    - type: ContainerContainer
      containers:
        gun_magazine: !type:ContainerSlot
        gun_chamber: !type:ContainerSlot
    - type: StaticPrice
      price: 500
#PARADISE EDIT END

- type: entity
  name: Bulldog
  # Don't parent to BaseWeaponShotgun because it differs significantly
  parent: [BaseItem, BaseGunWieldable, BaseSyndicateContraband]
  id: WeaponShotgunBulldog
  description: An automatic magazine-fed shotgun for close-quarters combat. Kicks like a mule on steroids. Uses .50 shotgun shells.
  components:
    - type: Sprite
      sprite: Objects/Weapons/Guns/Shotguns/bulldog.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-0
          map: ["enum.GunVisualLayers.Mag"]
    - type: Item
      size: Large
    - type: Clothing
      sprite: Objects/Weapons/Guns/Shotguns/bulldog.rsi
      quickEquip: false
      slots:
        - Back
        - suitStorage
    - type: AmmoCounter
    - type: CustomSpriteAmmoCounter
      loadedAmmoSprite: Interface/ItemStatus/Shotgun_Shells/not_spent.png
      spentAmmoSprite: Interface/ItemStatus/Shotgun_Shells/spent.png
    - type: GunRequiresWield #remove when inaccuracy on spreads is fixed
    #PARADISE EDIT START - ChamberMagazineExtension
    - type: GunWieldBonus
      minAngle: -5
      maxAngle: -17
      angleIncrease: -2.6
    - type: GunAimable
      minAngle: -8
      maxAngle: -7
    - type: Gun
      angleIncrease: 9
      angleDecay: 6
      minAngle: 15
      maxAngle: 35
      #PARADISE EDIT END
      fireRate: 2
      selectedMode: FullAuto
      availableModes:
        - FullAuto
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/shotgun.ogg
      soundEmpty:
        path: /Audio/Weapons/Guns/Empty/empty.ogg
    - type: ItemSlots
      slots:
        gun_magazine:
          name: Magazine
          startingItem: MagazineShotgun
          priority: 2
          whitelist:
            tags:
              - MagazineShotgun
          whitelistFailPopup: gun-magazine-whitelist-fail
          insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
          ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        #PARADISE EDIT START - ChamberMagazineExtension
        gun_chamber:
          name: Chamber
          startingItem: ShellShotgun
          priority: 1
          whitelist:
            tags:
              - ShellShotgun
        #PARADISE EDIT END
    - type: ContainerContainer
      containers:
        gun_magazine: !type:ContainerSlot
        gun_chamber: !type:ContainerSlot
    #PARADISE EDIT START - ChamberMagazineExtension
    - type: ChamberMagazineAmmoProvider
      soundRack:
        path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
    #PARADISE EDIT END
    - type: MagazineVisuals
      magState: mag
      steps: 1
      zeroVisible: true
    - type: Appearance
    - type: StaticPrice
      price: 5000

