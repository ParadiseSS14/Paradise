- type: entity
  parent: [SeatBase, BaseDeployFoldable]
  id: ChairFolding
  name: folding chair
  description: If you carry six of these you become the coolest kid at church.
  components:
    - type: Rotatable
    - type: Sprite
      sprite: Structures/Furniture/folding_chair.rsi
      layers:
        - state: folding
          map: ["unfoldedLayer"]
        - state: folding_folded
          map: ["foldedLayer"]
          visible: false
    - type: Item
      size: Huge
    - type: MeleeWeapon
      damage:
        types:
          Blunt: 8
      soundHit:
        collection: MetalThud
    - type: Construction
      graph: Seat
      node: chairFolding
    - type: DamageExaminable
    - type: Destructible
      thresholds:
        - trigger: !type:DamageTrigger
            damage: 50
          behaviors:
            - !type:DoActsBehavior
              acts: ["Destruction"]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak

