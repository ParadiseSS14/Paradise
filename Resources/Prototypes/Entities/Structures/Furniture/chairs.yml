- type: entity
  abstract: true
  id: SeatBase
  name: chair
  description: You sit in this. Either by will or force.
  placement:
    mode: PlaceFree
  components:
    - type: Animateable
    - type: Clickable
    - type: InteractionOutline
    - type: Physics
      bodyType: Dynamic
    - type: Fixtures
      fixtures:
        fix1:
          shape: !type:PhysShapeCircle
            radius: 0.2
          density: 100
          mask:
            - TableMask
    - type: Sprite
      sprite: Structures/Furniture/chairs.rsi
      noRot: true
    - type: Strap
      position: Stand
      buckleOffset: "0,-0.05"
    - type: Pullable
    - type: Damageable
      damageModifierSet: Metallic
    - type: Injurable
      damageContainer: Inorganic
    - type: StaticPrice
      price: 50

#Starts unanchored, cannot be rotated while anchored
- type: entity
  name: chair
  id: UnanchoredChairBase
  parent: SeatBase
  abstract: true
  components:
    - type: Anchorable
    - type: Rotatable

#Start anchored, cannot be rotated while anchored
- type: entity
  name: chair
  id: ChairBase
  abstract: true
  parent: UnanchoredChairBase
  placement:
    mode: SnapgridCenter
  components:
    - type: Physics
      bodyType: Static
    - type: Transform
      anchored: true

#Starts unanchored, can be rotated while anchored
- type: entity
  name: chair
  id: OfficeChairBase
  parent: UnanchoredChairBase
  abstract: true
  components:
    - type: Rotatable
      rotateWhileAnchored: true
    - type: Destructible
      thresholds:
        - trigger: !type:DamageTrigger
            damage: 50
          behaviors:
            - !type:DoActsBehavior
              acts: ["Destruction"]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak

#Starts anchored, can be rotated while anchored
- type: entity
  name: stool
  id: StoolBase
  parent: OfficeChairBase
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
    - type: Physics
      bodyType: Static
    - type: Transform
      anchored: true

- type: entity
  name: chair
  id: Chair
