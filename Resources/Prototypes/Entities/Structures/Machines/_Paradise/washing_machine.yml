- type: entity
  id: WashingMachine
  parent: [BaseMachinePowered, ConstructibleMachine, BaseConstructibleMachineDestructible]
  name: washing machine
  description: Gets rid of those pesky bloodstains, or your money back!
  components:
    - type: Sprite
      sprite: Structures/Machines/_Paradise/washingmachine.rsi
      layers:
        - state: base
        - state: filled
          map: ["filled"]
          visible: false
        - state: running
          map: ["running"]
          visible: false
        - state: closed
          map: ["door"]
        - state: panelopen
          map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - type: GenericVisualizer
      visuals:
        enum.WashingMachineVisual.State:
          door:
            Open: { state: open }
            Closed: { state: closed }
        enum.WashingMachineVisual.Filled:
          filled:
            True: { state: filled, visible: true }
            False: { visible: false }
        enum.WashingMachineVisual.Running:
          running:
            True: { state: running, visible: true }
            False: { visible: false }
    - type: WashingMachine
    - type: Appearance
    - type: WiresVisuals
    - type: WiresPanel
    - type: Machine
      board: WashingMachineCircuitboard
    - type: Construction
      graph: Machine
      node: machine
      containers:
        - machine_board
        - machine_parts
    - type: Fixtures
      fixtures:
        fix1:
          shape: !type:PhysShapeAabb
            bounds: "-0.25,-0.45,0.25,0.30"
          mask:
            - MachineMask
          layer:
            - MachineLayer
