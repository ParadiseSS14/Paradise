- type: entity
  parent: BaseMechAction
  id: ActionMechRelay
  components:
    - type: Action
      raiseOnUser: true
    - type: InstantAction
      event: !type:MechRelayActionEvent

- type: entity
  parent: BaseMechAction
  id: ActionPilotOpenUI
  name: Control Panel
  description: Opens the control panel for the mech
  components:
    - type: Action
      useDelay: 1
    - type: Sprite
      sprite: Interface/Actions/actions_mecha.rsi
      layers:
        - state: mech_view_stats
    - type: InstantAction
      event: !type:MechOpenUiEvent

- type: entity
  parent: BaseMechAction
  id: ActionPilotEject
  name: Eject
  description: Ejects the pilot from the mech
  components:
    - type: Action
    - type: Sprite
      sprite: Interface/Actions/actions_mecha.rsi
      layers:
        - state: mech_eject
    - type: InstantAction
      event: !type:MechEjectPilotEvent
