- type: entity
  parent: BasePDA
  id: RoboticistPDA
  name: roboticist PDA
  description: The data storage is almost fully occupied by technical documentation.
  components:
    - type: Pda
      id: RoboticistIDCard
    - type: Appearance
      appearanceDataInit:
        enum.PdaVisuals.PdaType: !type:String pda-roboticist
    - type: PdaBorderColor
      borderColor: "#414452"
      accentHColor: "#731611"
    - type: Sprite
      layers:
        - map: ["enum.PdaVisualLayers.Base"]
          state: "pda"
        - state: "light_overlay"
          map: ["enum.PdaVisualLayers.Flashlight"]
          shader: "unshaded"
          visible: false
        - state: "id_overlay"
          map: ["enum.PdaVisualLayers.IdLight"]
          visible: false
    - type: Icon
      state: pda-roboticist
    - type: Tag
      tags:
        - DoorBumpOpener
        - WhitelistChameleon
        - WhitelistChameleonPDA
