- type: entity
  name: taser
  parent: [BaseItem, BaseSecurityContraband]
  id: WeaponTaser
  description: A pneumatic dart gun feeding from cartridges.
  components:
    - type: Sprite
      sprite: Objects/Weapons/Guns/Battery/taser.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-0
          map: ["enum.GunVisualLayers.Mag"]
    - type: AmmoCounter
    #- type: GunAimable #To be decommented when aim system is merged
    #  minAngle: -6.5
    #  maxAngle: -6
    - type: Gun
      fireRate: 1
      cameraRecoilScalar: 0
      maxAngle: 15
      minAngle: 9
      angleIncrease: 0.09
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/taser.ogg
    - type: ItemSlots
      slots:
        gun_magazine:
          name: Magazine
          startingItem: MagazineTaser
          priority: 2
          whitelist:
            tags:
              - TaserCartridge
          whitelistFailPopup: gun-magazine-whitelist-fail
          insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
          ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
    - type: ContainerContainer
      containers:
        gun_magazine: !type:ContainerSlot
        gun_chamber: !type:ContainerSlot
    - type: MagazineAmmoProvider
    - type: MagazineVisuals
      magState: mag
      steps: 1
      zeroVisible: true
    - type: Appearance
    - type: StaticPrice
      price: 5000

- type: entity
  name: taser
  parent: [BaseCentcommContraband, WeaponTaser]
  id: WeaponTaserSuper
