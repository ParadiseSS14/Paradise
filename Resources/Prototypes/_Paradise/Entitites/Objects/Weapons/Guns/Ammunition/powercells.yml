- type: entity
  parent: BaseItem
  id: WeaponPowerCell
  name: weapon power cell
  description: Highly reliable portable battery that is standard issue for every popular energy weapon in local space. Can fit into most power cell slots.
  suffix: Laser
  components:
    - type: Item
    - type: Battery
      pricePerJoule: 0.15
      maxCharge: 1200
      startingCharge: 1200
    - type: BatteryVisuals
      levels: 3
    - type: GenericVisualizer
      visuals:
        enum.BatteryVisuals.State:
          enum.PowerCellVisualLayers.Unshaded:
            Full: { visible: true, state: o2 }
            Neither: { visible: true, state: o1 }
            Empty: { visible: false }
    - type: PowerCell
    - type: Sprite
      sprite: _Paradise/Objects/Weapons/Guns/Ammunition/Power/weapon_power_cells.rsi
      layers:
        - map: ["enum.PowerCellVisualLayers.Base"]
          state: base
        - map: ["enum.PowerCellVisualLayers.Unshaded"]
          state: o2
          shader: unshaded
    - type: SolutionContainerManager
      solutions:
        battery:
          maxVol: 5
    - type: InjectableSolution
      solution: battery
    - type: DrawableSolution
      solution: battery
    - type: Extractable
      juiceSolution:
        reagents:
          - ReagentId: Zinc
            Quantity: 5
    - type: Tag
      tags:
        - WeaponPowerCell
    - type: Appearance
    - type: Riggable
    - type: AmmoCounter
