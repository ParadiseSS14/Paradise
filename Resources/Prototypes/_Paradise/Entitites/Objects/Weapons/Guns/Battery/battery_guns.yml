- type: entity
  name: pulse rifle
  parent: [WeaponLaserCarbine, BaseCentcommContraband]
  id: WeaponPulseRifle
  description: Pinnacle of portable laser armament technology, this weapon is usually issued to elite assault units of the Solar Federation army and other well-equipped militaries.
  components:
    - type: Item
      size: Huge
      shape:
        - 0,0,4,1
      sprite: Objects/Weapons/Guns/Battery/pulse_rifle.rsi
    - type: MagazineVisuals
      magState: mag
      steps: 5
      zeroVisible: true
    - type: Sprite
      sprite: Objects/Weapons/Guns/Battery/pulse_rifle.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-unshaded-4
          map: ["enum.GunVisualLayers.MagUnshaded"]
          shader: unshaded
    - type: Appearance
    - type: Clothing
      sprite: Objects/Weapons/Guns/Battery/pulse_rifle.rsi
    - type: Gun
      selectedMode: SemiAuto
      fireRate: 4
      availableModes:
        - SemiAuto
        - FullAuto
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/laser3.ogg
    - type: BatteryAmmoProvider
      proto: PulseHeavy
      fireCost: 50
