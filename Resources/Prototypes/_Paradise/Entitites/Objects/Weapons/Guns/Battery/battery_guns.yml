- type: entity
  name: laser carbine
  parent: [BaseWeaponPowerCell, BaseGunWieldable, BaseSecurityContraband]
  id: WeaponLaserCarbine
  description: Optical Thermal Weapon Model 32. This carabine-sized pulse laser is widely used due to it being relatively cheap, easy to use and quite effective against humanoid targets.
  components:
    - type: Clothing
      sprite: _Paradise/Objects/Weapons/Guns/Battery/laser_gun.rsi
      quickEquip: false
      slots:
        - Back
        - suitStorage
        - Belt
    - type: Sprite
      sprite: _Paradise/Objects/Weapons/Guns/Battery/laser_gun.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-3
          map: ["enum.GunVisualLayers.Mag"]
        - state: mag-unshaded-3
          map: ["enum.GunVisualLayers.MagUnshaded"]
          shader: unshaded
    - type: Item
    - type: GunAimable
      minAngle: -7
      maxAngle: -5
    - type: Gun
      cameraRecoilScalar: 0 #Laser weapons have effectively no recoil
      maxAngle: 20
      minAngle: 15 #Very low values for the same reason
      angleIncrease: 0.09
    - type: GunWieldBonus
      minAngle: -5
      maxAngle: -13
    - type: MagazineVisuals
      magState: mag
      steps: 4
      zeroVisible: true
    - type: ItemSlots
      slots:
        cell_slot:
          name: Magazine
          startingItem: WeaponPowerCell
          insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
          ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
          whitelist:
            tags:
              - WeaponPowerCell
    - type: BatteryAmmoProvider
      proto: RedLaser
      fireCost: 50

- type: entity
  name: laser cannon
  parent: WeaponLaserCarbine
  id: WeaponLaserCannon
  description: A heavy duty, high power laser weapon. Emits laser pulses with energy output similar to full-sized rifle cartridges.
  components:
    - type: Item
      size: Huge
      shape:
        - 0,0,5,1
      sprite: Objects/Weapons/Guns/Battery/laser_cannon.rsi
    - type: Sprite
      sprite: Objects/Weapons/Guns/Battery/laser_cannon.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-unshaded-4
          map: ["enum.GunVisualLayers.MagUnshaded"]
          shader: unshaded
    - type: MagazineVisuals
      magState: mag
      steps: 5
      zeroVisible: false
    - type: Appearance
    - type: Clothing
      sprite: Objects/Weapons/Guns/Battery/laser_cannon.rsi
    - type: Gun
      fireRate: 1
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
    - type: BatteryAmmoProvider
      proto: RedHeavyLaser
      fireCost: 125

- type: entity
  name: pulse pistol
  parent: [BaseWeaponPowerCellSmall, BaseCentcommContraband]
  id: WeaponPulsePistol
  description: A state of the art energy pistol favoured as a sidearm by the NT operatives.
  components:
    - type: Sprite
      sprite: Objects/Weapons/Guns/Battery/pulse_pistol.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-unshaded-4
          map: ["enum.GunVisualLayers.MagUnshaded"]
          shader: unshaded
    - type: Item
      storedOffset: -2,-5
      sprite: Objects/Weapons/Guns/Battery/pulse_pistol.rsi
    - type: MagazineVisuals
      magState: mag
      steps: 5
      zeroVisible: true
    - type: Appearance
    - type: Clothing
      sprite: Objects/Weapons/Guns/Battery/pulse_pistol.rsi
    - type: Gun
      selectedMode: SemiAuto
      availableModes:
        - SemiAuto
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/laser3.ogg
    - type: BatteryAmmoProvider
      proto: Pulse
      fireCost: 100
    - type: Tag
      tags:
        - Sidearm
        - LaserWeapon

- type: entity
  name: pulse carbine
  parent: [WeaponLaserCarbine, BaseCentcommContraband]
